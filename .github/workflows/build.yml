name: Build firmware

# - Every push / pull request: compile all boards and upload binaries as workflow artifacts.
# - Pushing a tag like "v1.2.0": additionally publish all binaries to a GitHub Release.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # Board manager URLs for third-party cores
  ADDITIONAL_URLS: >-
    https://espressif.github.io/arduino-esp32/package_esp32_index.json,https://github.com/stm32duino/BoardManagerFiles/raw/main/package_stmicroelectronics_index.json
  # Required libraries (installed for every build, cheap)
  LIBRARIES: >-
    "Adafruit NeoPixel" "WiFiManager" "WebSockets" "Arduino_AdvancedAnalog"

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # ---------- NPG Lite (ESP32-C6) ----------
          - name: NPG-LITE-ESP32C6
            sketch: NPG-LITE
            core: esp32:esp32@3.2.0
            fqbn: esp32:esp32:esp32c6:CDCOnBoot=cdc
            files: merged.bin
          # NPG-LITE-BLE uses A6 (battery pin), which only exists on ESP32-C6
          - name: NPG-LITE-BLE-ESP32C6
            sketch: NPG-LITE-BLE
            core: esp32:esp32@3.2.0
            fqbn: esp32:esp32:esp32c6:CDCOnBoot=cdc
            files: merged.bin

          # ---------- ESP32-S3 ----------
          - name: ESP32-S3
            sketch: ESP32-S3
            core: esp32:esp32@3.2.0
            fqbn: esp32:esp32:esp32s3:CDCOnBoot=cdc
            files: merged.bin

          # ---------- STM32 ----------
          - name: STM32G4-CORE-BOARD
            sketch: STM32G4-CORE-BOARD
            core: STMicroelectronics:stm32@2.10.1
            fqbn: STMicroelectronics:stm32:GenG4:pnum=WEACT_G474CE,usb=CDCgen
            files: bin hex
          - name: STM32F401CC-BLACK-PILL
            sketch: STM32F4-BLACK-PILL
            core: STMicroelectronics:stm32@2.10.1
            fqbn: STMicroelectronics:stm32:GenF4:pnum=BLACKPILL_F401CC,usb=CDCgen
            files: bin hex
          - name: STM32F411CE-BLACK-PILL
            sketch: STM32F4-BLACK-PILL
            core: STMicroelectronics:stm32@2.10.1
            fqbn: STMicroelectronics:stm32:GenF4:pnum=BLACKPILL_F411CE,usb=CDCgen
            files: bin hex

          # ---------- Arduino Mbed ----------
          - name: GIGA-R1
            sketch: GIGA-R1
            core: arduino:mbed_giga@4.3.1
            fqbn: arduino:mbed_giga:giga
            files: bin
          - name: RPI-PICO-RP2040
            sketch: RPI-PICO-RP2040
            core: arduino:mbed_rp2040@4.3.1
            fqbn: arduino:mbed_rp2040:pico
            files: uf2

          # ---------- Arduino UNO R4 ----------
          - name: UNO-R4-MINIMA
            sketch: UNO-R4
            core: arduino:renesas_uno@1.5.1
            fqbn: arduino:renesas_uno:minima
            files: bin hex
          - name: UNO-R4-WIFI
            sketch: UNO-R4
            core: arduino:renesas_uno@1.5.1
            fqbn: arduino:renesas_uno:unor4wifi
            files: bin hex

          # ---------- AVR (board selected via BOARD_* macro) ----------
          - name: AVR-UNO-R3
            sketch: AVR-NANO-UNO-MEGA
            core: arduino:avr@1.8.6
            fqbn: arduino:avr:uno
            defines: -DBOARD_UNO_R3
            files: hex
          - name: AVR-GENUINO-UNO
            sketch: AVR-NANO-UNO-MEGA
            core: arduino:avr@1.8.6
            fqbn: arduino:avr:uno
            defines: -DBOARD_GENUINO_UNO
            files: hex
          - name: AVR-UNO-CLONE-MAKER-UNO
            sketch: AVR-NANO-UNO-MEGA
            core: arduino:avr@1.8.6
            fqbn: arduino:avr:uno
            defines: -DBOARD_UNO_CLONE
            files: hex
          - name: AVR-NANO-CLASSIC
            sketch: AVR-NANO-UNO-MEGA
            core: arduino:avr@1.8.6
            fqbn: arduino:avr:nano:cpu=atmega328
            defines: -DBOARD_NANO_CLASSIC
            files: hex
          - name: AVR-NANO-CLONE-MAKER-NANO
            sketch: AVR-NANO-UNO-MEGA
            core: arduino:avr@1.8.6
            fqbn: arduino:avr:nano:cpu=atmega328old
            defines: -DBOARD_NANO_CLONE
            files: hex
          - name: AVR-MEGA-2560-R3
            sketch: AVR-NANO-UNO-MEGA
            core: arduino:avr@1.8.6
            fqbn: arduino:avr:mega:cpu=atmega2560
            defines: -DBOARD_MEGA_2560_R3
            files: hex
          - name: AVR-MEGA-2560-CLONE
            sketch: AVR-NANO-UNO-MEGA
            core: arduino:avr@1.8.6
            fqbn: arduino:avr:mega:cpu=atmega2560
            defines: -DBOARD_MEGA_2560_CLONE
            files: hex

    steps:
      - uses: actions/checkout@v4

      - uses: arduino/setup-arduino-cli@v2

      - name: Cache Arduino cores
        uses: actions/cache@v4
        with:
          path: ~/.arduino15
          key: arduino15-${{ matrix.core }}

      - name: Install core and libraries
        run: |
          arduino-cli config init --overwrite --additional-urls "$ADDITIONAL_URLS"
          arduino-cli core update-index
          arduino-cli core install "${{ matrix.core }}"
          eval arduino-cli lib install $LIBRARIES

      - name: Compile
        run: |
          args=()
          if [[ -n "${{ matrix.defines }}" ]]; then
            args+=(--build-property "compiler.cpp.extra_flags=${{ matrix.defines }}")
          fi
          arduino-cli compile --fqbn "${{ matrix.fqbn }}" "${args[@]}" \
            --warnings default --output-dir build "${{ matrix.sketch }}"

      - name: Package binaries
        run: |
          mkdir -p dist
          for ext in ${{ matrix.files }}; do
            src="build/${{ matrix.sketch }}.ino.$ext"
            # ESP32 merged image (bootloader + partitions + app) is flashed at 0x0
            out_ext="${ext#merged.}"
            cp -v "$src" "dist/Chords-${{ matrix.name }}.$out_ext"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          body: |
            ## Firmware binaries

            Download the file matching your board:

            | Board | File | How to flash |
            | ----- | ---- | ------------ |
            | NPG Lite (ESP32-C6) | `Chords-NPG-LITE-ESP32C6.bin` | esptool / web flasher, offset `0x0` |
            | NPG Lite BLE (ESP32-C6) | `Chords-NPG-LITE-BLE-ESP32C6.bin` | esptool / web flasher, offset `0x0` |
            | ESP32-S3 | `Chords-ESP32-S3.bin` | esptool / web flasher, offset `0x0` |
            | STM32G4 Core Board (WeAct G474CE) | `Chords-STM32G4-CORE-BOARD.bin` | STM32CubeProgrammer / DFU, `0x08000000` |
            | STM32F4 Black Pill (F401CC / F411CE) | `Chords-STM32F401CC-BLACK-PILL.bin` / `Chords-STM32F411CE-BLACK-PILL.bin` | STM32CubeProgrammer / DFU, `0x08000000` |
            | Arduino GIGA R1 | `Chords-GIGA-R1.bin` | `dfu-util` |
            | Raspberry Pi Pico | `Chords-RPI-PICO-RP2040.uf2` | Hold BOOTSEL, drag & drop the `.uf2` |
            | Arduino UNO R4 Minima / WiFi | `Chords-UNO-R4-MINIMA.bin` / `Chords-UNO-R4-WIFI.bin` | `bossac` / Arduino IDE |
            | Arduino UNO R3 / Genuino UNO / UNO clone / Maker UNO | `Chords-AVR-UNO-R3.hex` / `Chords-AVR-GENUINO-UNO.hex` / `Chords-AVR-UNO-CLONE-MAKER-UNO.hex` | `avrdude` |
            | Arduino Nano / Nano clone / Maker Nano | `Chords-AVR-NANO-CLASSIC.hex` / `Chords-AVR-NANO-CLONE-MAKER-NANO.hex` | `avrdude` (clones use the old bootloader, 57600 baud) |
            | Arduino MEGA 2560 / MEGA clone | `Chords-AVR-MEGA-2560-R3.hex` / `Chords-AVR-MEGA-2560-CLONE.hex` | `avrdude` |

            Verify downloads with `SHA256SUMS.txt`.
